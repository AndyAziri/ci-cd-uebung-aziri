name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "pom.xml", ".github/workflows/**", "Dockerfile", ".dockerignore"]
  pull_request:
    paths: ["src/**", "pom.xml", ".github/workflows/**", "Dockerfile", ".dockerignore"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21]
        exclude:
          - os: windows-latest
            java: 17
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and run tests
        run: mvn -B verify
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports/

  sonar:
    name: SonarCloud analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (full history for Sonar)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  docker:
    name: Docker build & export image
    needs: [build, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (single-arch, loaded into local Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: andyaziri/ci-cd-uebung:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tar
        run: docker save andyaziri/ci-cd-uebung:${{ env.SHORT_SHA }} -o docker-image-${{ env.SHORT_SHA }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ env.SHORT_SHA }}
          path: docker-image-${{ env.SHORT_SHA }}.tar
          retention-days: 7